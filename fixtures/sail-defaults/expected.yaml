presets: [compose, sail, laravel, vite]
alias: defaults.test
routes:
  - port: 80
    role: web
    label: laravel.test (APP_PORT)
  - port: 1025
    role: ignore
    label: mailpit (FORWARD_MAILPIT_PORT)
  - port: 3306
    role: ignore
    label: mysql (FORWARD_DB_PORT)
  - port: 5173
    role: loopback
    label: Vite (VITE_PORT)
  - port: 6379
    role: ignore
    label: redis (FORWARD_REDIS_PORT)
  - port: 8025
    role: ignore
    label: mailpit (FORWARD_MAILPIT_DASHBOARD_PORT)
advisories:
  - id: app-url
    message: 'APP_URL is "http://localhost". Generated links will use it, so set it to the alias.'
    snippet: APP_URL=https://defaults.test
  - id: vite-default-port
    message: 'Vite will use the default port 5173, which other Vite projects also use. Set VITE_PORT in .env so projects can run side by side.'
    snippet: VITE_PORT=5174
