presets: [compose, sail, laravel, vite]
routes:
  - port: 5180
    role: loopback
    label: Vite (VITE_PORT)
  - port: 8220
    role: web
    label: laravel.test (APP_PORT)
    hosts: [app.local.x.io]
advisories:
  - id: app-url
    message: 'APP_URL is "https://app.local.x.io:8220". Generated links will use it, so set it to one of the project''s addresses, with https and no port.'
    snippet: APP_URL=https://app.local.x.io
