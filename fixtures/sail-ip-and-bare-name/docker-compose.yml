services:
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.4
    image: sail-8.4/app
    ports:
      - '${APP_PORT:-80}:80'
      - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
      - '${FORWARD_REVERB_PORT:-8080}:8080'
    environment:
      LARAVEL_SAIL: 1
    volumes:
      - '.:/var/www/html'
