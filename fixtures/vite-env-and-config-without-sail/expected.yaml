presets: [compose, sail, laravel, vite]
alias: x.test
routes:
  - port: 5180
    role: web
    label: Vite (vite.config)
advisories:
  - id: allowed-hosts
    message: 'Vite rejects requests for x.test unless it is in server.allowedHosts.'
    snippet: |
      // vite.config.ts
      export default defineConfig({
        server: {
          allowedHosts: ['x.test'],
        },
      })
