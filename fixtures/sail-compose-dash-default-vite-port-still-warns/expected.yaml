presets: [compose, sail, vite]
alias: x.test
routes:
  - port: 80
    role: web
    label: laravel.test (APP_PORT)
  - port: 5176
    role: loopback
    label: Vite (VITE_PORT)
# A Compose default for VITE_PORT only maps the port: in the container
# VITE_PORT is unset, so laravel-vite-plugin starts Vite on 5173.
advisories:
  - id: vite-default-port
    message: 'Vite will use the default port 5173, which other Vite projects also use. Set VITE_PORT in .env so projects can run side by side.'
    snippet: VITE_PORT=5173
