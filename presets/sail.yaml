schema: 1
name: sail
title: Laravel Sail
description: Forwards the Vite dev server that Laravel Sail runs inside its container.
after: [vite]
detect: >-
  compose.contains("laravel/sail") || compose.contains("image: sail-")
  || compose.contains("image: 'sail-") || compose.contains("image: \"sail-")
  || compose.contains("LARAVEL_SAIL")
compose: ports

ports:
  - var: VITE_PORT
    label: Vite
    role: loopback

suppress: [vite-config-port, allowed-hosts]

advisories:
  - id: vite-default-port
    when: >-
      active("vite") && presets["vite"].port == 0
      && !("VITE_PORT" in env && env["VITE_PORT"].trim() != "")
    message: Vite will use the default port 5173, which other Vite projects also use. Set VITE_PORT in .env so projects can run side by side.
    snippet: VITE_PORT={{ free_port(5173) }}
