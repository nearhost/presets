schema: 2
name: sail
title: Laravel Sail
description: Forwards the Vite dev server that Laravel Sail runs, and serves the hosts in APP_URL, REVERB_HOST and FILES_URL or MINIO_URL.
after: [vite]
detect: >-
  compose.contains("laravel/sail") || compose.contains("image: sail-")
  || compose.contains("image: 'sail-") || compose.contains("image: \"sail-")
  || compose.contains("LARAVEL_SAIL")
compose: ports

ports:
  - var: VITE_PORT
    label: Vite
    role: loopback

routes:
  - id: app-hosts
    when: '"APP_URL" in env'
    port: env_port("APP_PORT", 80)
    label: App
    hosts: '[url_host(env["APP_URL"])]'
  - id: reverb-hosts
    when: '"REVERB_HOST" in env && ("FORWARD_REVERB_PORT" in env || compose.contains("FORWARD_REVERB_PORT"))'
    port: env_port("FORWARD_REVERB_PORT", 8080)
    label: Reverb
    hosts: '[url_host(env["REVERB_HOST"])]'
  - id: minio-hosts
    when: '("FILES_URL" in env || "MINIO_URL" in env) && ("FORWARD_MINIO_PORT" in env || compose.contains("FORWARD_MINIO_PORT"))'
    port: env_port("FORWARD_MINIO_PORT", 9000)
    label: MinIO
    hosts: '("FILES_URL" in env ? [url_host(env["FILES_URL"])] : []) + ("MINIO_URL" in env ? [url_host(env["MINIO_URL"])] : [])'

suppress: [vite-config-port, allowed-hosts]

# laravel-vite-plugin starts Vite on server.port, else VITE_PORT from .env or
# the environment, else 5173. A Compose environment entry for VITE_PORT, in
# map or list form, sets the environment; a ports default only maps the port.
advisories:
  - id: vite-default-port
    when: >-
      active("vite") && !(presets["vite"].sets_port && !presets["vite"].port_from_vite_port)
      && !("VITE_PORT" in env && env["VITE_PORT"].trim() != "")
      && !(compose.matches("(?m)^\\s*-?\\s*[\x27\"]?VITE_PORT\\s*[:=]\\s*[\x27\"]?(?:\\$\\{VITE_PORT:?-)?[0-9]+")
        && !compose.matches("(?m)^\\s*-?\\s*[\x27\"]?VITE_PORT\\s*[:=]\\s*[\x27\"]?(?:\\$\\{VITE_PORT:?-)?5173\\b"))
    message: Vite will use the default port 5173, which other Vite projects also use. Set VITE_PORT in .env so projects can run side by side.
    snippet: VITE_PORT={{ free_port(5173) }}
