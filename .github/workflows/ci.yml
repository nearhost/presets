name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: make install-nearhost
      - run: make check NEARHOST="$(go env GOPATH)/bin/nearhost"
      - run: shellcheck scripts/*.sh
      - run: bash scripts/test-index-pr.sh

  # Rebuild index.yaml and, when it changed, open or update the pull request
  # that publishes it (scripts/index-pr.sh), as release-please does for
  # releases. Nothing is pushed to main.
  index-pr:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: index-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: false
      - run: make install-nearhost
      - run: make index NEARHOST="$(go env GOPATH)/bin/nearhost"
      # The app's token, unlike GITHUB_TOKEN, starts CI on the pull request it
      # opens, so the required check can pass. It is made only now, after every
      # build step, and only the next step sees it.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.NH_APP_CLIENT_ID }}
          private-key: ${{ secrets.NH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - run: scripts/index-pr.sh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
